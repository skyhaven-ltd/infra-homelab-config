                "gridPos": {"h": 4, "w": 4, "x": 4, "y": 3},
                "id": 3,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "smartmon_device_smart_healthy{disk=\"/dev/nvme0\"}", "refId": "A"}],
                "title": "NVMe SMART",
