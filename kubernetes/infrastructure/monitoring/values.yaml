# k3s runs the scheduler, controller-manager, and kube-proxy inside the
# k3s-server binary with metrics bound to 127.0.0.1, and uses sqlite instead
# of etcd, so the chart's default ServiceMonitors have no targets and the
# *Down alerts fire via absent().
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

grafana:
  # Without this the subchart renders a new random admin password on every Helm
  # render. Argo rewrites the generated secret, Grafana resets its database
  # password from that secret on every start, and the value nobody has ever
  # seen changes again on the next sync - so admin login is permanently broken.
  #
  # Unlike the other platform credentials this password is deliberately NOT in
  # Key Vault; it is held in Bitwarden. The grafana-admin secret therefore is
  # not reconciled by Ansible and must be recreated by hand on a cluster
  # rebuild - Grafana will not start without it. See docs/backup-restore.md.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - grafana.lab.skyhaven.ltd
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.lab.skyhaven.ltd
  # RWO PVC deadlocks RollingUpdate: new pod can't mount while old holds claim
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: homelab
          orgId: 1
          folder: Homelab
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/homelab
  dashboards:
    homelab:
      mission-control:
        json: |
          {
            "annotations": {"list": []},
            "editable": true,
            "graphTooltip": 1,
            "panels": [
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 70}, {"color": "red", "value": 90}]}, "unit": "percent"}},
                "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0},
                "id": 1,
                "options": {"graphMode": "area", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "100 - (avg(rate(node_cpu_seconds_total{instance=~\"$node\",mode=\"idle\"}[5m])) * 100)", "refId": "A"}],
                "title": "Host CPU",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 75}, {"color": "red", "value": 90}]}, "unit": "percent"}},
                "gridPos": {"h": 5, "w": 4, "x": 4, "y": 0},
                "id": 2,
                "options": {"graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "100 * (1 - node_memory_MemAvailable_bytes{instance=~\"$node\"} / node_memory_MemTotal_bytes{instance=~\"$node\"})", "refId": "A"}],
                "title": "Host Memory",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 75}, {"color": "red", "value": 90}]}, "unit": "percent"}},
                "gridPos": {"h": 5, "w": 4, "x": 8, "y": 0},
                "id": 3,
                "options": {"graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "100 * (1 - node_filesystem_avail_bytes{instance=~\"$node\",mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{instance=~\"$node\",mountpoint=\"/\",fstype!~\"tmpfs|overlay\"})", "refId": "A"}],
                "title": "Root Disk",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"unit": "s"}},
                "gridPos": {"h": 5, "w": 4, "x": 12, "y": 0},
                "id": 4,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "time() - node_boot_time_seconds{instance=~\"$node\"}", "refId": "A"}],
                "title": "Host Uptime",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
                "gridPos": {"h": 5, "w": 4, "x": 16, "y": 0},
                "id": 5,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A"}],
                "title": "Ready Nodes",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "gridPos": {"h": 5, "w": 4, "x": 20, "y": 0},
                "id": 6,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "refId": "A"}],
                "title": "Running Pods",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"unit": "percent"}},
                "gridPos": {"h": 8, "w": 8, "x": 0, "y": 5},
                "id": 7,
                "targets": [
                  {"expr": "100 - (avg(rate(node_cpu_seconds_total{instance=~\"$node\",mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU", "refId": "A"},
                  {"expr": "100 * (1 - node_memory_MemAvailable_bytes{instance=~\"$node\"} / node_memory_MemTotal_bytes{instance=~\"$node\"})", "legendFormat": "Memory", "refId": "B"}
                ],
                "title": "Host Utilisation",
                "type": "timeseries"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"unit": "Bps"}},
                "gridPos": {"h": 8, "w": 8, "x": 8, "y": 5},
                "id": 8,
                "targets": [
                  {"expr": "sum(rate(node_network_receive_bytes_total{instance=~\"$node\",device!~\"lo|veth.*|cali.*\"}[5m]))", "legendFormat": "Receive", "refId": "A"},
                  {"expr": "sum(rate(node_network_transmit_bytes_total{instance=~\"$node\",device!~\"lo|veth.*|cali.*\"}[5m]))", "legendFormat": "Transmit", "refId": "B"}
                ],
                "title": "Host Network",
                "type": "timeseries"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"unit": "Bps"}},
                "gridPos": {"h": 8, "w": 8, "x": 16, "y": 5},
                "id": 9,
                "targets": [
                  {"expr": "sum(rate(node_disk_read_bytes_total{instance=~\"$node\"}[5m]))", "legendFormat": "Read", "refId": "A"},
                  {"expr": "sum(rate(node_disk_written_bytes_total{instance=~\"$node\"}[5m]))", "legendFormat": "Write", "refId": "B"}
                ],
                "title": "Host Disk I/O",
                "type": "timeseries"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
                "id": 10,
                "targets": [
                  {"expr": "node_load1{instance=~\"$node\"}", "legendFormat": "1 minute", "refId": "A"},
                  {"expr": "node_load5{instance=~\"$node\"}", "legendFormat": "5 minutes", "refId": "B"},
                  {"expr": "node_load15{instance=~\"$node\"}", "legendFormat": "15 minutes", "refId": "C"}
                ],
                "title": "System Load",
                "type": "timeseries"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
                "id": 11,
                "targets": [{"expr": "sum by (phase) (kube_pod_status_phase)", "refId": "A"}],
                "title": "Pod Health",
                "type": "timeseries"
              },
              {
                "gridPos": {"h": 1, "w": 24, "x": 0, "y": 21},
                "id": 20,
                "title": "Homelab Health",
                "type": "row"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "description": "Tailscale backend state on the k3s node. Down means no remote access at all.",
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"text": "Down"}, "1": {"text": "Up"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
                "gridPos": {"h": 4, "w": 3, "x": 0, "y": 22},
                "id": 21,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "max(homelab_tailscale_backend_running)", "refId": "A"}],
                "title": "Tailnet Backend",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "description": "Subnet route approved in the tailnet. Unapproved after a rebuild until Terraform reruns.",
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"text": "No"}, "1": {"text": "Yes"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
                "gridPos": {"h": 4, "w": 3, "x": 3, "y": 22},
                "id": 22,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "max(homelab_tailscale_route_approved)", "refId": "A"}],
                "title": "Subnet Route",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "description": "API server certificate covers the node's current tailnet address and MagicDNS name.",
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"text": "Stale"}, "1": {"text": "OK"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
                "gridPos": {"h": 4, "w": 3, "x": 6, "y": 22},
                "id": 23,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "max(homelab_apiserver_cert_covers_tailnet)", "refId": "A"}],
                "title": "kubectl TLS Path",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "description": "BookBuddy generation worker timer. Absent means queued jobs are never claimed.",
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"text": "Missing"}, "1": {"text": "Active"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
                "gridPos": {"h": 4, "w": 3, "x": 9, "y": 22},
                "id": 24,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "max(homelab_bookbuddy_worker_timer_active)", "refId": "A"}],
                "title": "BookBuddy Worker",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}},
                "gridPos": {"h": 4, "w": 3, "x": 12, "y": 22},
                "id": 25,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "sum(bookbuddy_generation_jobs{status=\"pending\"})", "refId": "A"}],
                "title": "Gen Jobs Pending",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
                "gridPos": {"h": 4, "w": 3, "x": 15, "y": 22},
                "id": 26,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "sum(bookbuddy_generation_jobs{status=\"failed\"})", "refId": "A"}],
                "title": "Gen Jobs Failed",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "description": "HD-or-better Sonarr qualities with no maximum size. Non-zero lets a season balloon.",
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
                "gridPos": {"h": 4, "w": 3, "x": 18, "y": 22},
                "id": 27,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "max(homelab_sonarr_quality_definitions_uncapped)", "refId": "A"}],
                "title": "Sonarr Uncapped",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "description": "Series not on the managed quality profile, which is how they end up unscored.",
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
                "gridPos": {"h": 4, "w": 3, "x": 21, "y": 22},
                "id": 28,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "max(homelab_sonarr_series_off_managed_profile)", "refId": "A"}],
                "title": "Series Off Profile",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "gridPos": {"h": 7, "w": 12, "x": 0, "y": 26},
                "id": 29,
                "targets": [{"expr": "sum by (status) (bookbuddy_generation_jobs)", "legendFormat": "{{status}}", "refId": "A"}],
                "title": "BookBuddy Generation Queue",
                "type": "timeseries"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "description": "A pending age that keeps climbing means nothing is draining the queue.",
                "fieldConfig": {"defaults": {"unit": "s"}},
                "gridPos": {"h": 7, "w": 12, "x": 12, "y": 26},
                "id": 30,
                "targets": [
                  {"expr": "max(bookbuddy_generation_job_oldest_pending_age_seconds)", "legendFormat": "Oldest pending", "refId": "A"},
                  {"expr": "max(bookbuddy_generation_job_oldest_running_age_seconds)", "legendFormat": "Oldest running", "refId": "B"}
                ],
                "title": "Generation Job Age",
                "type": "timeseries"
              }
            ],
            "refresh": "30s",
            "schemaVersion": 41,
            "tags": ["homelab", "mission-control", "kubernetes"],
            "templating": {
              "list": [
                {"current": {}, "hide": 0, "label": "Data source", "name": "datasource", "query": "prometheus", "type": "datasource"},
                {"current": {}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "definition": "label_values(node_uname_info, instance)", "includeAll": true, "label": "Node", "multi": true, "name": "node", "query": {"query": "label_values(node_uname_info, instance)", "refId": "StandardVariableQuery"}, "refresh": 1, "type": "query"}
              ]
            },
            "time": {"from": "now-6h", "to": "now"},
            "timezone": "browser",
            "title": "Homelab Mission Control",
            "uid": "homelab-mission-control",
            "version": 1
          }
      disk-health:
        json: |
          {
            "annotations": {"list": []},
            "editable": true,
            "graphTooltip": 1,
            "panels": [
              {
                "gridPos": {"h": 3, "w": 24, "x": 0, "y": 0},
                "id": 1,
                "options": {"content": "Physical disks on the Proxmox host **lnproxlab01**. The **Seagate ST1000LM014** HDD (`/dev/sda` on the host) is passed through to the k3s VM as `/dev/sdc` and mounted at `/mnt/media`. The **WD SN740 NVMe** (`nvme0`) holds the VM's root (`/`) and appdata (`/srv/appdata`) disks.", "mode": "markdown"},
                "title": "Disk Layout",
                "type": "text"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"text": "Failing"}, "1": {"text": "Passed"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
