                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
                "gridPos": {"h": 4, "w": 4, "x": 16, "y": 7},
                "id": 12,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "nvme_media_errors_total", "refId": "A"}],
                "title": "NVMe Media Errors",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "max": 1, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.6}, {"color": "green", "value": 0.8}]}, "unit": "percentunit"}},
                "gridPos": {"h": 4, "w": 4, "x": 20, "y": 7},
                "id": 13,
                "options": {"graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "nvme_available_spare_ratio", "refId": "A"}],
                "title": "NVMe Spare Remaining",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "gridPos": {"h": 6, "w": 24, "x": 0, "y": 11},
                "id": 14,
                "options": {"showHeader": true},
                "targets": [{"expr": "smartmon_device_info", "format": "table", "instant": true, "refId": "A"}],
                "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "Value": true, "__name__": true, "job": true, "vendor": true, "product": true, "revision": true, "lun_id": true}}}],
                "title": "Devices",
                "type": "table"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"unit": "celsius"}},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 17},
                "id": 15,
                "targets": [
                  {"expr": "smartmon_temperature_celsius_raw_value", "legendFormat": "{{disk}}", "refId": "A"},
                  {"expr": "nvme_temperature_celsius", "legendFormat": "{{device}}", "refId": "B"}
                ],
                "title": "Disk Temperatures",
                "type": "timeseries"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 17},
                "id": 16,
                "targets": [
                  {"expr": "smartmon_reallocated_sector_ct_raw_value", "legendFormat": "Reallocated", "refId": "A"},
                  {"expr": "smartmon_current_pending_sector_raw_value", "legendFormat": "Pending", "refId": "B"},
                  {"expr": "smartmon_offline_uncorrectable_raw_value", "legendFormat": "Offline uncorrectable", "refId": "C"},
                  {"expr": "smartmon_reported_uncorrect_raw_value", "legendFormat": "Reported uncorrectable", "refId": "D"},
                  {"expr": "smartmon_udma_crc_error_count_raw_value", "legendFormat": "UDMA CRC errors", "refId": "E"}
                ],
                "title": "Media HDD Error Counters",
                "type": "timeseries"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"max": 100, "min": 0, "unit": "percent"}},
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 25},
                "id": 17,
                "targets": [{"expr": "100 * (1 - node_filesystem_avail_bytes{job=\"node-exporter\",mountpoint=~\"/|/srv/appdata|/mnt/media\"} / node_filesystem_size_bytes{job=\"node-exporter\",mountpoint=~\"/|/srv/appdata|/mnt/media\"})", "legendFormat": "{{mountpoint}}", "refId": "A"}],
                "title": "k3s VM Filesystem Usage",
                "type": "timeseries"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"max": 1, "min": 0, "unit": "percentunit"}},
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 25},
                "id": 18,
                "targets": [
                  {"expr": "nvme_percentage_used_ratio", "legendFormat": "Endurance used", "refId": "A"},
                  {"expr": "nvme_available_spare_ratio", "legendFormat": "Spare remaining", "refId": "B"}
                ],
                "title": "NVMe Wear",
                "type": "timeseries"
              }
            ],
            "refresh": "1m",
            "schemaVersion": 41,
            "tags": ["homelab", "disks", "smart"],
            "templating": {
              "list": [
                {"current": {}, "hide": 0, "label": "Data source", "name": "datasource", "query": "prometheus", "type": "datasource"}
              ]
            },
            "time": {"from": "now-7d", "to": "now"},
            "timezone": "browser",
            "title": "Disk Health",
            "uid": "homelab-disk-health",
            "version": 1
          }

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 8GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    additionalScrapeConfigs:
      - job_name: proxmox-disk-health
        scrape_interval: 60s
        static_configs:
          - targets:
              - 192.168.1.2:9100
            labels:
              instance: lnproxlab01

alertmanager:
  config:
    route:
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: ntfy-monitoring
      routes:
        - receiver: discard
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: ntfy-monitoring
        webhook_configs:
          # Phones subscribe to http://192.168.1.3:8090/monitoring.
          - url: http://ntfy.stockalert.svc.cluster.local/monitoring?template=alertmanager
            send_resolved: true
            http_config:
              follow_redirects: true
      - name: discard
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  # The DaemonSet already bind-mounts the host root at /host/root, so pointing
  # the textfile collector inside it needs no extra volume. The files are
  # written by the homelab_metrics Ansible role.
  extraArgs:
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi

# Alerts for the failure modes that survived the cluster rebuild silently:
# remote access to the API server, the BookBuddy generation queue, and the
# Sonarr guardrails that stop a single season reaching 50GB.
additionalPrometheusRulesMap:
  homelab:
    groups:
      - name: homelab-remote-access
        rules:
          - alert: TailscaleBackendDown
            expr: max(homelab_tailscale_backend_running) == 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: Tailscale is down on the k3s node
              description: >-
                The node is off the tailnet, so kubectl and every lab service
                are unreachable from outside the LAN.
          - alert: TailscaleSubnetRouteNotApproved
            expr: max(homelab_tailscale_route_approved) == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Advertised subnet route is not approved
              description: >-
                The LAN subnet route is advertised but not approved in the
                tailnet. Re-run the tailscale Terraform stack.
          - alert: ApiServerCertMissingTailnetName
            expr: max(homelab_apiserver_cert_covers_tailnet) == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: API server certificate does not cover the tailnet address
              description: >-
                Remote kubectl will fail TLS verification. A rebuild changes the
                node's tailnet address; re-run the k3s role to reissue the
                certificate.
          - alert: HomelabMetricsStale
            expr: time() - max(homelab_metrics_last_run_timestamp_seconds) > 900
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Homelab metrics exporter has stopped publishing
              description: >-
                Every homelab_* alert below is blind until the exporter timer
                runs again.

      - name: homelab-bookbuddy
        rules:
          - alert: BookBuddyWorkerTimerMissing
            expr: max(homelab_bookbuddy_worker_timer_active) == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: BookBuddy generation worker is not installed
              description: >-
                Queued generation jobs will never be claimed. Re-run the
                bookbuddy_worker Ansible role with CODEX_AUTH_FILE set.
          - alert: BookBuddyWorkerRunFailing
            expr: max(homelab_bookbuddy_worker_last_run_ok) == 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: BookBuddy generation worker runs are failing
          - alert: BookBuddyGenerationJobStalled
            expr: max(bookbuddy_generation_job_oldest_pending_age_seconds) > 1800
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: A BookBuddy generation job has sat pending for over 30 minutes
              description: >-
                Nothing is draining the queue. This is the state that went
                unnoticed for a day after the rebuild.
          - alert: BookBuddyGenerationJobStuckRunning
            expr: max(bookbuddy_generation_job_oldest_running_age_seconds) > 3600
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: A BookBuddy generation job has been running for over an hour
              description: >-
                A worker most likely died mid-job; nothing resets the claim.
          - alert: BookBuddyGenerationJobsFailing
            expr: delta(bookbuddy_generation_jobs{status="failed"}[1h]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: A BookBuddy generation job failed in the last hour
              description: >-
                The alert resolves after the investigation window instead of
                treating retained historical failures as an active incident.

      - name: homelab-media
        rules:
          - alert: SonarrQualityDefinitionsUncapped
            expr: max(homelab_sonarr_quality_definitions_uncapped) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Sonarr HD qualities have no maximum size
              description: >-
                Sonarr will accept whatever an indexer offers. Buildarr owns
                these sizes; check it reconciled and that recyclarr is not
                re-applying the TRaSH quality definition template.
          - alert: SonarrSeriesOffManagedProfile
            expr: max(homelab_sonarr_series_off_managed_profile) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Sonarr series are not on the managed quality profile
              description: >-
                Series on the default profile get no custom-format scoring and
                no upgrade cutoff, which is how oversized releases get grabbed.

      - name: homelab-disks
        rules:
          - alert: DiskHealthExporterDown
            expr: up{job="proxmox-disk-health"} == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Proxmox disk health exporter is unreachable
              description: >-
                SMART data for the Proxmox host disks is not being collected,
                so every other disk alert is blind.
          - alert: DiskHealthDataStale
            expr: time() - node_textfile_mtime_seconds{job="proxmox-disk-health",file=~".*(smartmon|nvme).prom"} > 3600
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Disk health data on {{ $labels.file }} is over an hour old
              description: >-
                The smartmon or nvme collector timer on the Proxmox host has
                stopped writing, so disk alerts are evaluating stale values.
          - alert: DiskSmartUnhealthy
            expr: smartmon_device_smart_healthy == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: SMART overall health failed on {{ $labels.disk }}
              description: >-
                The drive reports that it is failing. Copy anything that is not
                backed up off it and plan a replacement.
          - alert: DiskPendingOrUncorrectableSectors
            expr: smartmon_current_pending_sector_raw_value > 0 or smartmon_offline_uncorrectable_raw_value > 0
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.disk }} has unreadable sectors"
              description: >-
                Pending or offline-uncorrectable sectors are a strong early
                sign of drive failure.
          - alert: DiskReallocatedSectorsIncreasing
            expr: delta(smartmon_reallocated_sector_ct_raw_value[24h]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.disk }} reallocated sectors in the last day"
          - alert: DiskUncorrectableErrorsIncreasing
            expr: delta(smartmon_reported_uncorrect_raw_value[24h]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.disk }} reported new uncorrectable errors in the last day"
              description: >-
                The media HDD already carries a historical count, so this
                fires on growth rather than on the absolute value.
          - alert: DiskTemperatureHigh
            expr: smartmon_temperature_celsius_raw_value > 58
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.disk }} is at {{ $value }}C"
              description: >-
                The media HDD is rated to 60C. Check airflow around the
                Proxmox host.
          - alert: NvmeCriticalWarning
            expr: nvme_critical_warning_total > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.device }} raised an NVMe critical warning"
          - alert: NvmeMediaErrors
            expr: nvme_media_errors_total > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.device }} has recorded media errors"
          - alert: NvmeSpareLow
            expr: nvme_available_spare_ratio <= nvme_available_spare_threshold_ratio
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.device }} has used its spare blocks down to the threshold"
          - alert: NvmeWearHigh
            expr: nvme_percentage_used_ratio > 0.8
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.device }} is over 80% of its rated endurance"
          - alert: NvmeTemperatureHigh
            expr: nvme_temperature_celsius > 70
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.device }} is at {{ $value }}C"
