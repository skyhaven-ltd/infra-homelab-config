                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 50}, {"color": "red", "value": 58}]}, "unit": "celsius"}},
                "gridPos": {"h": 4, "w": 4, "x": 8, "y": 3},
                "id": 4,
                "options": {"graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "smartmon_temperature_celsius_raw_value{disk=\"/dev/sda\"}", "refId": "A"}],
                "title": "Media HDD Temperature",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 60}, {"color": "red", "value": 70}]}, "unit": "celsius"}},
                "gridPos": {"h": 4, "w": 4, "x": 12, "y": 3},
                "id": 5,
                "options": {"graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
                "targets": [{"expr": "nvme_temperature_celsius", "refId": "A"}],
                "title": "NVMe Temperature",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${datasource}"},
                "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "max": 1, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.6}, {"color": "red", "value": 0.8}]}, "unit": "percentunit"}},
                "gridPos": {"h": 4, "w": 4, "x": 16, "y": 3},
