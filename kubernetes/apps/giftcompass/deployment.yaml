apiVersion: apps/v1
kind: Deployment
metadata:
  name: giftcompass
  namespace: giftcompass
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: giftcompass
  template:
    metadata:
      labels:
        app: giftcompass
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: app
          image: ghcr.io/skyhaven-ltd/infra-homelab-config/giftcompass:latest
          imagePullPolicy: Always
          env:
            - { name: DATABASE_PATH, value: /data/giftcompass.db }
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: giftcompass-data
