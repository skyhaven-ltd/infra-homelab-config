apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: buildarr
resources:
  - deployment.yaml
  - queue-maintenance-cronjob.yaml
  - availability-search-cronjob.yaml
configMapGenerator:
  - name: buildarr-config
    files:
      - files/entrypoint.sh
      - files/buildarr.yml.tmpl
      - files/wait-for-dependencies.py
      - files/queue-maintenance.py
      - files/availability-search.py
