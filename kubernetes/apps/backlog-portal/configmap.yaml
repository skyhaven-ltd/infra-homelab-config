    "Task":".github/ISSUE_TEMPLATE/task.md"}}]
  GITHUB_ORGANISATION: skyhaven-ltd
  AZURE_DEVOPS_ORGANISATION: version1ukdcs
  TEMPLATE_REPOSITORY: skyhaven-ltd/.github
  GITHUB_PROJECT_ID: PVT_kwDOEbaq0c4BcELw
