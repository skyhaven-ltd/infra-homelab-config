  PORTAL_TARGETS: >-
    [{"id":"github-homelab","provider":"github",
    "label":"infra-homelab-config","organisation":"skyhaven-ltd",
    "container":"infra-homelab-config","project_id":"PVT_kwDOEbaq0c4BcELw",
