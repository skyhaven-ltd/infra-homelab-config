---
name: Backlog Portal

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/backlog-portal/**"
      - ".github/workflows/service-backlog-portal.yml"
  push:
    branches:
      - main
    paths:
      - "services/backlog-portal/**"
      - ".github/workflows/service-backlog-portal.yml"

permissions:
  contents: read

concurrency:
  group: backlog-portal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/backlog-portal
  PYTHON_VERSION: "3.12"

jobs:
  Validate:
    name: Test and Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backlog-portal/requirements-dev.txt

      - name: Install Dependencies
        working-directory: services/backlog-portal
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint and Format Check
        working-directory: services/backlog-portal
        run: |
          python -m ruff check app tests scripts
          python -m ruff format --check app tests scripts

      - name: Test
        working-directory: services/backlog-portal
        run: python -m pytest

      - name: Build Container
        run: docker build --tag "${IMAGE}:${GITHUB_SHA}" services/backlog-portal

  Publish:
    name: Publish Container
    if: github.event_name == 'push'
    needs: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Build Container
        run: |
          set -euo pipefail
          docker build \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            services/backlog-portal

      - name: Login and Publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
