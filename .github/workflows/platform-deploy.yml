---
name: Reconcile Platform

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: homelab-platform-state
  cancel-in-progress: false

env:
  ANSIBLE_CORE_VERSION: "2.21.1"
  TERRAFORM_VERSION: "1.15.7"

jobs:
  terraform:
    name: Terraform Apply (${{ matrix.root }})
    runs-on: [self-hosted, homelab]
    environment: homelab
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - root: cluster
            state_key: cluster.tfstate
            arguments: -var-file=vars/homelab.tfvars
          - root: runner
            state_key: runner.tfstate
            arguments: -var-file=vars/homelab.tfvars
          - root: tailscale
            state_key: tailscale.tfstate
            arguments: ""
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_PLATFORM_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_PLATFORM_SUBSCRIPTION_ID }}
      - name: Ensure State Container
        uses: skyhaven-ltd/pipeline-engineering-github-actions/actions/ensure-tfstate-container@6cfa143b42ff464e4101d69c09945db9fac369e5
        with:
          storage_account_name: stplatformprduks02
          login: "false"
      - name: Fetch Proxmox Credential
        if: matrix.root != 'tailscale'
        uses: skyhaven-ltd/pipeline-engineering-github-actions/actions/keyvault-secrets@6cfa143b42ff464e4101d69c09945db9fac369e5
        with:
          keyvault_name: kv-platform-prd-uks-02
          login: "false"
          secrets: |
            TF_VAR_proxmox_api_token=homelab-proxmox-api-token
            TF_VAR_proxmox_ssh_private_key=homelab-proxmox-ssh-private-key
      - name: Fetch Tailscale Credential
        if: matrix.root == 'tailscale'
        uses: skyhaven-ltd/pipeline-engineering-github-actions/actions/keyvault-secrets@6cfa143b42ff464e4101d69c09945db9fac369e5
        with:
          keyvault_name: kv-platform-prd-uks-02
          login: "false"
          secrets: TAILSCALE_API_KEY=homelab-tailscale-api-key
      - name: Terraform Init
        uses: skyhaven-ltd/pipeline-engineering-github-actions/actions/terraform-backend-init@6cfa143b42ff464e4101d69c09945db9fac369e5
        with:
          environment: prd
          working_directory: terraform/${{ matrix.root }}
          state_key: ${{ matrix.state_key }}
          platform_subscription_id: ${{ vars.AZURE_PLATFORM_SUBSCRIPTION_ID }}
      - name: Terraform Plan
        env:
          ROOT: ${{ matrix.root }}
          TF_ARGUMENTS: ${{ matrix.arguments }}
        run: |
          set -euo pipefail
          # Intentional word splitting permits zero or one static tfvars argument from the matrix.
          # shellcheck disable=SC2086
          timeout --foreground --signal=TERM --kill-after=30s 12m \
            terraform -chdir="terraform/${ROOT}" plan \
            -input=false -lock-timeout=5m -out=tfplan ${TF_ARGUMENTS}
      - name: Reject Destructive Terraform Plan
        env:
          ROOT: ${{ matrix.root }}
        run: |
          set -euo pipefail
          plan_json="${RUNNER_TEMP}/${ROOT}-tfplan.json"
          trap 'rm -f "${plan_json}"' EXIT
          terraform -chdir="terraform/${ROOT}" show -json tfplan > "${plan_json}"
          python3 - "${plan_json}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              plan = json.load(stream)

          destructive = [
              change["address"]
              for change in plan.get("resource_changes", [])
              if "delete" in change.get("change", {}).get("actions", [])
          ]
          if destructive:
              print("::error::Destructive Terraform plan rejected: " + ", ".join(destructive))
              raise SystemExit(1)
          PY
      - name: Terraform Apply Exact Plan
        env:
          ROOT: ${{ matrix.root }}
        run: |
          timeout --foreground --signal=TERM --kill-after=30s 25m \
            terraform -chdir="terraform/${ROOT}" apply -input=false -auto-approve tfplan
      - name: Verify Terraform Convergence
        env:
          ROOT: ${{ matrix.root }}
          TF_ARGUMENTS: ${{ matrix.arguments }}
        run: |
          set -euo pipefail
          # Exit code 2 means applying the saved plan did not leave a converged state.
          # shellcheck disable=SC2086
          timeout --foreground --signal=TERM --kill-after=30s 12m \
            terraform -chdir="terraform/${ROOT}" plan \
            -input=false -lock-timeout=5m -detailed-exitcode ${TF_ARGUMENTS}

  ansible:
    name: Ansible Converge
    needs: terraform
    runs-on: [self-hosted, homelab]
    environment: homelab
    timeout-minutes: 45
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_PLATFORM_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_PLATFORM_SUBSCRIPTION_ID }}
      - name: Fetch Deployment Secrets
        uses: skyhaven-ltd/pipeline-engineering-github-actions/actions/keyvault-secrets@6cfa143b42ff464e4101d69c09945db9fac369e5
        with:
          keyvault_name: kv-platform-prd-uks-02
          login: "false"
          secrets: |
            ANSIBLE_SSH_PRIVATE_KEY=homelab-ansible-ssh-private-key
            TAILSCALE_API_KEY=homelab-tailscale-api-key
      - name: Install Ansible
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --disable-pip-version-check \
            "ansible-core==${ANSIBLE_CORE_VERSION}"
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"
      - name: Write Deployment SSH Key
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "${ANSIBLE_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/homelab_deploy"
      - name: Install Collections
        working-directory: ansible
        run: ansible-galaxy install -r requirements.yml
      - name: Converge Kubernetes Host
        working-directory: ansible
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/homelab_deploy
        run: ansible-playbook -i inventory/hosts.yml site.yml
      - name: Verify Kubernetes Host Idempotency
        working-directory: ansible
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/homelab_deploy
        run: |
          set -euo pipefail
          output="$(ANSIBLE_NOCOLOR=1 ansible-playbook -i inventory/hosts.yml site.yml --check)"
          printf '%s\n' "${output}"
          if grep -Eq 'changed=[1-9][0-9]*' <<< "${output}"; then
            echo "::error::Ansible did not converge cleanly on the Kubernetes host."
            exit 1
          fi
      - name: Converge Actions Runner
        working-directory: ansible
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/homelab_deploy
        run: ansible-playbook -i inventory/runner.yml site.yml --tags gha_runner
      - name: Verify Actions Runner Idempotency
        working-directory: ansible
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/homelab_deploy
        run: |
          set -euo pipefail
          output="$(ANSIBLE_NOCOLOR=1 ansible-playbook -i inventory/runner.yml site.yml --tags gha_runner --check)"
          printf '%s\n' "${output}"
          if grep -Eq 'changed=[1-9][0-9]*' <<< "${output}"; then
            echo "::error::Ansible did not converge cleanly on the Actions runner."
            exit 1
          fi
      - name: Remove Job Secret
        if: always()
        run: rm -f "${RUNNER_TEMP}/homelab_deploy"
