k3s_version: "v1.36.2+k3s1"
appdata_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
appdata_mount: /srv/appdata
media_mount: /mnt/media
# Physical disk ST1000LM014 (serial W38139VJ), passed through to the VM as
# scsi2. Reformatted 2026-07-26; the previous UUID belonged to a disk image on
# Proxmox storage, which is what allowed a VM destroy to delete the library.
media_fs_uuid: ad11ccae-6007-4b6e-8da9-1d5b0c481d09
appdata_backup_stage: /var/backups/appdata
appdata_backup_remote: "onedrive:07 - Digital/Container Backups"
appdata_backup_local_keep: 3
appdata_backup_remote_retain_days: 30
appdata_backup_remote_max_delete: 5
rclone_onedrive_token: "{{ lookup('env', 'RCLONE_ONEDRIVE_TOKEN') }}"
rclone_onedrive_drive_id: "{{ lookup('env', 'RCLONE_ONEDRIVE_DRIVE_ID') }}"
rclone_onedrive_drive_type: personal
node_ip: 192.168.1.3
tailscale_hostname: lnsvrk8s01
# A rebuild re-registers the node and it gets a new 100.x address, so the
# MagicDNS name is the only tailnet endpoint stable across rebuilds. Both go in
# the API server certificate so remote kubectl works without subnet routes.
tailscale_magicdns_suffix: tail1092e5.ts.net
tailscale_api_key: "{{ lookup('env', 'TAILSCALE_API_KEY') }}"
cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
knowledge_mcp_bearer_token: "{{ lookup('env', 'KNOWLEDGE_MCP_BEARER_TOKEN') }}"
bookbuddy_worker_token: "{{ lookup('env', 'BOOKBUDDY_WORKER_TOKEN') }}"
prowlarr_api_key: "{{ lookup('env', 'PROWLARR_API_KEY') }}"
prowlarr_admin_username: admin
prowlarr_admin_password: "{{ lookup('env', 'PROWLARR_ADMIN_PASSWORD') }}"
radarr_api_key: "{{ lookup('env', 'RADARR_API_KEY') }}"
sonarr_api_key: "{{ lookup('env', 'SONARR_API_KEY') }}"
tailscale_advertised_routes:
  - 192.168.1.0/24
