- name: Install disk health collectors
  ansible.builtin.apt:
    name:
      - prometheus-node-exporter
      - prometheus-node-exporter-collectors
      - smartmontools
      - nvme-cli
      - jq
      - moreutils
    install_recommends: false
    update_cache: true

- name: Configure node exporter arguments
  ansible.builtin.template:
    src: prometheus-node-exporter.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  notify: restart prometheus node exporter

- name: Create node exporter drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Restrict node exporter to allowed scrapers
  ansible.builtin.template:
    src: ip-allow.conf.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/ip-allow.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart prometheus node exporter

- name: Enable node exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter.service
    enabled: true
    state: started
    daemon_reload: true

- name: Enable disk health collector timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - prometheus-node-exporter-smartmon.timer
    - prometheus-node-exporter-nvme.timer
