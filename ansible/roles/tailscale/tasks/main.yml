- name: Add tailscale repo key/source
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg -o /usr/share/keyrings/tailscale-archive-keyring.gpg
    curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list -o /etc/apt/sources.list.d/tailscale.list
  args: { creates: /etc/apt/sources.list.d/tailscale.list }
- name: Install tailscale
  ansible.builtin.apt: { name: tailscale, update_cache: true }
- name: Enable IPv4 forwarding for advertised routes
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true
- name: Check tailscale backend state
  ansible.builtin.command: tailscale status
  register: ts_status
  changed_when: false
  failed_when: false
- name: Require the Tailscale API credential when joining the tailnet
  ansible.builtin.assert:
    that:
      - tailscale_api_key | length > 0
    fail_msg: TAILSCALE_API_KEY is required to provision a new Tailscale node
  when: ts_status.rc != 0
- name: Create a single-use Tailscale auth key
  ansible.builtin.uri:
    url: https://api.tailscale.com/api/v2/tailnet/-/keys
    method: POST
    url_username: "{{ tailscale_api_key }}"
    url_password: ""
    force_basic_auth: true
    body_format: json
    body:
      capabilities:
        devices:
          create:
            reusable: false
            ephemeral: false
            preauthorized: true
    status_code: 200
  register: tailscale_auth_key
  delegate_to: localhost
  become: false
  no_log: true
  when: ts_status.rc != 0
- name: Bring up tailscale (MagicDNS OFF on this node — see decision 1.13)
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--authkey={{ tailscale_auth_key.json.key }}"
      - --accept-dns=false
      - --hostname=lnsvrk8s01
      - "--advertise-routes={{ tailscale_advertised_routes | join(',') }}"
  when:
    - ts_status.rc != 0
    - not ansible_check_mode
  no_log: true
- name: Reconcile tailscale node preferences
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - --accept-dns=false
      - --hostname=lnsvrk8s01
      - "--advertise-routes={{ tailscale_advertised_routes | join(',') }}"
  changed_when: false
  when: not ansible_check_mode
