- name: k3s config directory
  ansible.builtin.file:
    { path: /etc/rancher/k3s, state: directory, mode: "0755" }
- name: k3s config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      disable:
        - traefik
      node-ip: {{ node_ip }}
      tls-san:
        - lnsvrk8s01
        - 192.168.1.3
        - {{ node_ip }}
      default-local-storage-path: {{ appdata_mount }}/local-path
      write-kubeconfig-mode: "0640"
  notify: restart k3s
- name: Install k3s (pinned)
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -s - server
  args: { creates: /usr/local/bin/k3s }
- name: Kubeconfig directory for the SSH administration user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
- name: Install kubeconfig for the SSH administration user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
- name: Select the user kubeconfig in login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/kubeconfig.sh
    content: |
      export KUBECONFIG="$HOME/.kube/config"
    owner: root
    group: root
    mode: "0644"
- name: Fetch kubeconfig to controller
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/lnsvrk8s01-kubeconfig"
    flat: true
- name: Point fetched kubeconfig at the node (raw k3s.yaml uses 127.0.0.1)
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/lnsvrk8s01-kubeconfig"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ node_ip }}:6443"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode
