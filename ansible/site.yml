- hosts: all
  become: true
  roles:
    - { role: users, tags: [users] }

- hosts: k8s
  become: true
  roles:
    - { role: base, tags: [base] }
    - { role: tailscale, tags: [tailscale] }
    - { role: k3s, tags: [k3s] }
    - { role: argocd_bootstrap, tags: [argocd] }
    - { role: appdata_backup, tags: [appdata_backup] }
    - { role: homelab_metrics, tags: [homelab_metrics] }
    - role: bookbuddy_worker
      tags: [bookbuddy_worker]
      when: "'bookbuddy_worker' in ansible_run_tags"
    - role: backlog_portal_worker
      tags: [backlog_portal_worker]
      when: "'backlog_portal_worker' in ansible_run_tags"

- hosts: gha_runner
  become: true
  roles:
    - { role: gha_runner, tags: [gha_runner] }
